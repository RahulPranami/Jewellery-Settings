name: Automate Plugin Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep -m 1 "Version:" jewellery-settings.php | awk '{print $NF}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ env.VERSION }} already exists. Skipping release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup PHP
        if: steps.check_tag.outputs.exists == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Install dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: composer install --no-dev --optimize-autoloader

      - name: Create ZIP Archive
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          # Use zip to include vendor folder and respect .gitattributes for exclusions if needed
          # But zip doesn't natively respect .gitattributes like git archive does.
          # We can use git archive and then add the vendor folder to it.
          git archive --format zip --output jewellery-settings.zip HEAD
          zip -ur jewellery-settings.zip vendor/

      - name: Create Release
        if: steps:check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: jewellery-settings.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
